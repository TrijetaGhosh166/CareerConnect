{% extends 'base.html' %}
{% block title %}Post a Job | CareerConnect{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <h2 class="mb-3">Post a Job</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>{{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary">Publish</button>
  </form>
</div></div>
<script>
  document.querySelectorAll('form input, form select, form textarea').forEach(function (el) {
    if (el.type !== 'hidden') el.classList.add(el.tagName === 'SELECT' ? 'form-select' : 'form-control');
  });
</script>
{% endblock %}
