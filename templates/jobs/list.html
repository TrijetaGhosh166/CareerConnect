{% extends 'base.html' %}
{% block title %}Jobs | CareerConnect{% endblock %}
{% block content %}
<h2 class="mb-3">Browse Jobs</h2>
<form method="get" class="row g-2 mb-4">
  <div class="col-md-5"><input name="q" value="{{ q }}" class="form-control" placeholder="Title, skill or company"></div>
  <div class="col-md-4"><input name="location" value="{{ location }}" class="form-control" placeholder="Location"></div>
  <div class="col-auto"><button class="btn btn-primary">Search</button></div>
</form>
<div class="row g-3">
  {% for job in jobs %}
    <div class="col-md-4">{% include 'core/_job_card.html' %}</div>
  {% empty %}
    <p class="text-muted">No jobs found.</p>
  {% endfor %}
</div>
{% endblock %}
