<div class="card h-100 shadow-sm">
  <div class="card-body">
    <h5 class="card-title">{{ job.title }}</h5>
    <h6 class="card-subtitle mb-2 text-muted">{{ job.company }}</h6>
    <p class="mb-1"><strong>Hiring for:</strong> {{ job.domain }}</p>
    <span class="badge bg-secondary">{{ job.get_job_type_display }}</span>
    <span class="badge bg-light text-dark border">{{ job.location }}</span>
    {% if job.salary %}<span class="badge bg-success">{{ job.salary }}</span>{% endif %}
  </div>
  <div class="card-footer bg-white border-0">
    <a href="{% url 'job_detail' job.id %}" class="btn btn-primary btn-sm">View Description &amp; Apply</a>
  </div>
</div>
