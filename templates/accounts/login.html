{% extends 'base.html' %}
{% block title %}Login | CareerConnect{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
  <h2 class="mb-3">Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 text-center">New here? <a href="{% url 'registration' %}">Register</a></p>
</div></div>
<script>
  document.querySelectorAll('form input').forEach(function (el) {
    if (el.type !== 'hidden') el.classList.add('form-control');
  });
</script>
{% endblock %}
